server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jotirling_traders?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5175}
app.cookie-secure=${COOKIE_SECURE:false}
app.admin-email=${ADMIN_EMAIL:admin@jotirling.local}
app.admin-password=${ADMIN_PASSWORD:}
app.push-public=${VAPID_PUBLIC_KEY:}
app.push-private=${VAPID_PRIVATE_KEY:}
app.push-subject=${VAPID_SUBJECT:mailto:admin@example.com}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.error.include-message=never
